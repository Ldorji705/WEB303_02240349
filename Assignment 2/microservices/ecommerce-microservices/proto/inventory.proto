syntax = "proto3";

package inventory;

option go_package = "ecommerce-microservices/proto";

service InventoryService {
    rpc CheckStock (CheckStockRequest) returns (StockResponse);
    rpc ReduceStock (ReduceStockRequest) returns (StockResponse);
}

message CheckStockRequest {
    string product_id = 1;
}

message ReduceStockRequest {
    string product_id = 1;
    int32 quantity = 2;
}

message StockResponse {
    string product_id = 1;
    int32 quantity = 2;
    string message = 3;
}